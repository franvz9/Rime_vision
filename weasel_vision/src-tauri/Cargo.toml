[package]
name = "weasel-vision"
version = "0.4.0"
description = "Rime Weasel configuration tool"
authors = ["franvz9"]
edition = "2021"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
serde_json = "1"
rime-core = { path = "../crates/rime-core" }

[dev-dependencies]
tempfile = "3"
ts-rs = "10"
# 集成测试（tests/）直接使用
serde = { version = "1", features = ["derive"] }
serde_yaml = "0.9"
