[package]
name = "rime-core"
version = "0.5.0"
description = "Rime 配置核心逻辑（无 UI 框架依赖），供 Tauri 壳与 GPUI 前端共用"
authors = ["franvz9"]
edition = "2021"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
dirs = "5"
chrono = "0.4"
regex = "1"
anyhow = "1"
uuid = { version = "1", features = ["v4"] }
parking_lot = "0.12"
open = "5"
thiserror = "2"
ts-rs = "10"

[target.'cfg(windows)'.dependencies]
winreg = "0.52"

[dev-dependencies]
tempfile = "3"
