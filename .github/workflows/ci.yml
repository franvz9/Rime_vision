# CI 质量门禁：RimeVision GPUI 版（rime-core + weasel-gpui）
# 发版构建见 release-gpui.yml

name: CI

on:
  workflow_dispatch:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        platform: [macos-latest, windows-latest]
    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: weasel_vision

    steps:
      - uses: actions/checkout@v4

      # rust-toolchain.toml 固定 1.100（gpui-pre 0.3.12 需要）
      - name: Install Rust 1.100
        uses: dtolnay/rust-toolchain@1.100
        with:
          components: rustfmt, clippy

      # dtolnay action 对版本化 tag 可能不安装 components，显式补装（在 weasel_vision 内解析到 1.100）
      - name: Ensure fmt/clippy components
        working-directory: weasel_vision
        run: rustup component add rustfmt clippy

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: weasel_vision

      - name: Cargo fmt check
        run: cargo fmt --check

      - name: Cargo check
        run: cargo check

      - name: Cargo clippy
        run: cargo clippy -- -D warnings

      - name: Cargo test
        run: cargo test
